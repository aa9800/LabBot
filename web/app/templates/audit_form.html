{% extends "base.html" %}
{% block title %}새 실사 · LabKeeper{% endblock %}
{% block content %}
<h1>새 재고 실사</h1>
<p class="hint">아직 로봇이 연동되지 않아, 실제로 선반에서 확인한 물품을 체크해 제출하세요. 체크되지 않은 물품은 자동으로 "불일치"로 기록됩니다. (이후 단계에서 Raspbot이 이 화면과 같은 로직을 자동으로 호출하도록 대체됩니다.)</p>
<form method="post" action="/audits/new">
  <label>수행자</label>
  <input type="text" name="performed_by" placeholder="이름" required style="max-width:220px;">

  <h2>확인된 물품</h2>
  <div class="checklist">
    {% for item in items %}
    <label><input type="checkbox" name="checked_items" value="{{ item.id }}"> {{ item.name }} <span style="color:var(--muted); font-size:12px;">({{ item.location }})</span></label>
    {% endfor %}
  </div>

  <div style="margin-top:18px;">
    <button class="btn" type="submit">실사 제출</button>
    <a class="btn secondary" href="/audits">취소</a>
  </div>
</form>
{% endblock %}
