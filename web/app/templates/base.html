<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LabBot{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <svg class="brand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6" />
      <circle cx="12" cy="12" r="2" fill="currentColor" />
      <path d="M12 2V5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      <path d="M12 19V22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      <path d="M2 12H5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      <path d="M19 12H22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
    <span class="brand-text">LabBot</span>
    <span class="brand-tag">AI VISION</span>
  </a>
  <nav>
    <a href="/">홈</a>
    <a href="/items">물품목록</a>
    <a href="/loans">대여·반납</a>
    <a href="/admin">관리자</a>
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer>
  <span>LabBot — AI 비전 기반 연구실 물품 관리</span>
  <span>실사·Safety 이벤트까지 실제로 동작하는 프로토타입</span>
</footer>
</body>
</html>
