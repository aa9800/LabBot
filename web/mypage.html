<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabBot – 연구실 물품 대여관리 시스템</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="mypage">
  <header class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="index.html">
        <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
          <path d="M12 2V5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M12 19V22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M2 12H5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M19 12H22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span class="logo-text">LabBot</span>
        <span class="logo-tag">AI VISION</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" data-nav="home">홈</a>
        <a href="items.html" data-nav="items">물품목록</a>
        <a href="chatbot.html" data-nav="chatbot">챗봇</a>
        <a href="mypage.html" data-nav="mypage" class="nav-mypage-link">마이페이지</a>
        <a href="login.html" data-nav="login">로그인</a>
        <a href="admin.html" data-nav="admin" class="nav-admin-link">
          <svg class="nav-admin-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          관리자
        </a>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">마이페이지</h1>
    <p class="page-subtitle">내 대여 현황과 이용 이력을 확인하세요</p>

    <section class="profile-card">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div class="profile-info">
        <h2 class="profile-name" id="profileName">-</h2>
        <p class="profile-email" id="profileEmail">-</p>
        <span class="profile-role" id="profileRole">-</span>
      </div>
      <div class="profile-stats">
        <div class="stat-tile">
          <span class="stat-value" id="statActiveCount">0</span>
          <span class="stat-label">대여중</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="statTotalCount">0</span>
          <span class="stat-label">총 대여횟수</span>
        </div>
      </div>
    </section>

    <section class="mypage-section">
      <h2 class="section-heading">대여중인 물품</h2>
      <div class="rental-list" id="activeRentalList"></div>
      <p class="item-empty-state" id="activeRentalEmpty">현재 대여중인 물품이 없습니다.</p>
    </section>

    <section class="mypage-section">
      <h2 class="section-heading">이용 이력</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>물품명</th>
              <th>대여일시</th>
              <th>반납일시</th>
            </tr>
          </thead>
          <tbody id="rentalHistoryBody"></tbody>
        </table>
      </div>
      <p class="item-empty-state" id="rentalHistoryEmpty">아직 이용 이력이 없습니다.</p>
    </section>
  </main>

  <a href="chatbot.html" class="fab" aria-label="챗봇 열기">💬</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/items-data.js"></script>
  <script src="js/rentals.js"></script>
  <script src="js/damage-data.js"></script>
  <script src="js/mypage.js"></script>
</body>
</html>
