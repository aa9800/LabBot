<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가상 생명공학 실험실 – LabBot 디지털 트윈</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/virtual-lab.css" />
</head>
<body data-page="lab-twin">
  <header class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="index.html">
        <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
          <path d="M12 2V5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M12 19V22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M2 12H5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M19 12H22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span class="logo-text">LabBot</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" data-nav="home">홈</a>
        <a href="items.html" data-nav="items">물품목록</a>
        <a href="lab-twin.html" data-nav="lab-twin" style="color:#0284c7; font-weight:700;">가상 실험실</a>
        <a href="mypage.html" data-nav="mypage" class="nav-mypage-link">마이페이지</a>
        <a href="login.html" data-nav="login">로그인</a>
        <a href="admin.html" data-nav="admin" class="nav-admin-link">
          <svg class="nav-admin-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          관리자
        </a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="lab-twin-container">
      <!-- 상단 정보 및 필터 바 -->
      <div class="lab-header-card">
        <div class="lab-header-top">
          <div class="lab-title-group">
            <h2>
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#0284c7" stroke-width="2">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
              가상 생명공학 실험실 (2.5D Digital Twin)
            </h2>
            <p>실제 연구실 공간과 Supabase DB 재고가 100% 동기화된 가상 환경입니다.</p>
          </div>

          <div class="lab-status-legend">
            <span class="legend-item"><span class="legend-dot dot-available"></span> 대여/사용 가능</span>
            <span class="legend-item"><span class="legend-dot dot-low"></span> 재고 부족</span>
            <span class="legend-item"><span class="legend-dot dot-out"></span> 품절/만료</span>
            <span class="legend-item"><span class="legend-dot dot-maint"></span> 점검 중</span>
          </div>
        </div>

        <div class="lab-controls-bar">
          <div class="room-filter-tabs" id="roomTabsContainer"></div>
          <div class="lab-search-box">
            <input type="text" class="lab-search-input" id="labSearchInput" placeholder="물품명 또는 위치코드(EQ-01) 검색..." / aria-label="물품명 또는 위치코드(EQ-01) 검색...">
          </div>
        </div>
      </div>

      <!-- 메인 2.5D 뷰포트 + 인스펙터 레이아웃 -->
      <div class="lab-main-layout">
        <div class="lab-viewport-card">
          <div class="lab-viewport-osd">
            <span class="osd-badge">TWIN: BIOTECH-LAB-01</span>
            <span class="osd-badge" style="color:#10b981;">DB SYNC: LIVE</span>
          </div>

          <!-- 2.5D 캔버스 인터페이스 -->
          <div class="lab-canvas-container" id="labCanvas"></div>
        </div>

        <!-- 우측 물품 상세 및 가상 예약/스캔 패널 -->
        <div class="lab-inspector-card">
          <div class="inspector-header">
            <h3 id="inspectTitle">물품을 선택하세요</h3>
            <span class="inspector-room-badge" id="inspectRoom">실험실 구역 미선택</span>
          </div>

          <div class="inspector-info-grid">
            <span class="info-label">분류</span>
            <span class="info-value" id="inspectCategory">-</span>

            <span class="info-label">실시간 재고</span>
            <span class="info-value" id="inspectStock" style="color:#0284c7;">-</span>

            <span class="info-label">재고 상태</span>
            <span class="info-value" id="inspectStatus">-</span>

            <span class="info-label">보관 조건</span>
            <span class="info-value" id="inspectStorage">-</span>

            <span class="info-label">유효기간</span>
            <span class="info-value" id="inspectExpires">-</span>
          </div>

          <p id="inspectDesc" style="color:#64748b; font-size:0.85rem; line-height:1.4; margin-bottom:1.25rem;">
            가상 실험실의 실험대나 보관 캐비닛에 배치된 대표 물품 노드를 클릭하면 실시간 DB 데이터와 연동됩니다.
          </p>

          <div class="inspector-actions" id="inspectActions"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="scannerModalContainer"></div>

  <!-- 스크립트 로드 순서 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/items-data.js"></script>
  <script src="js/rentals.js"></script>
  <script src="js/virtual-lab-data.js"></script>
  <script src="js/virtual-lab.js"></script>
</body>
</html>
