<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabBot – 연구실 물품 대여관리 시스템</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="items">
  <header class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="index.html">
        <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
          <path d="M12 2V5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M12 19V22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M2 12H5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M19 12H22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span class="logo-text">LabBot</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" data-nav="home">홈</a>
        <a href="items.html" data-nav="items">물품목록</a>
        <a href="lab-twin.html" data-nav="lab-twin">가상실험실</a>
        <a href="mypage.html" data-nav="mypage" class="nav-mypage-link">마이페이지</a>
        <a href="login.html" data-nav="login">로그인</a>
        <a href="admin.html" data-nav="admin" class="nav-admin-link">
          <svg class="nav-admin-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          관리자
        </a>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page-title">물품 목록</h1>
    <p class="page-subtitle">필요한 물품을 검색하고 대여하거나 사용 처리하세요</p>

    <div class="list-toolbar">
      <div class="search-box">
        <input type="text" id="itemSearch" placeholder="물품 이름으로 검색" autocomplete="off" / aria-label="물품 이름으로 검색">
      </div>
      <select id="itemLocationFilter" aria-label="보관 위치로 거르기" class="location-filter-select">
        <option value="all">전체 위치</option>
        <!-- js/items.js에서 실제 등록된 위치 목록으로 채움 -->
      </select>
      <div class="category-filters" id="categoryFilters">
        <button type="button" class="category-filter-btn active" data-category="all">전체</button>
        <button type="button" class="category-filter-btn" data-category="EQUIPMENT">장비</button>
        <button type="button" class="category-filter-btn" data-category="REAGENT">시약</button>
        <button type="button" class="category-filter-btn" data-category="CONSUMABLE">소모품</button>
        <button type="button" class="category-filter-btn" data-category="PPE">PPE</button>
        <button type="button" class="category-filter-btn" data-category="SAFETY">안전물품</button>
      </div>
    </div>

    <section class="item-list" id="itemList"></section>
    <p class="item-empty-state" id="itemEmptyState">검색 결과가 없습니다.</p>
    <div class="pagination" id="itemPagination"></div>
  </main>

  <button type="button" class="fab fab-inquiry" id="inquiryFabBtn" aria-label="문의하기">✉️</button>
  <button type="button" class="fab" id="chatFabBtn" aria-label="챗봇 열기">💬</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/items-data.js"></script>
  <script src="js/rentals.js"></script>
  <script src="js/inquiry-data.js"></script>
  <script src="js/restock-data.js"></script>
  <script src="js/inquiry-widget.js"></script>
  <script src="js/chat-data.js"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/rental-progress-widget.js"></script>
  <script src="js/items.js"></script>
</body>
</html>
