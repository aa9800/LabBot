<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabBot – 연구실 물품 대여관리 시스템</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <header class="navbar">
    <div class="navbar-inner">
      <a class="logo" href="index.html">
        <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
          <path d="M12 2V5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M12 19V22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M2 12H5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <path d="M19 12H22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span class="logo-text">LabBot</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" data-nav="home">홈</a>
        <a href="items.html" data-nav="items">물품목록</a>
        <a href="lab-twin.html" data-nav="lab-twin">가상실험실</a>
        <a href="mypage.html" data-nav="mypage" class="nav-mypage-link">마이페이지</a>
        <a href="login.html" data-nav="login">로그인</a>
        <a href="admin.html" data-nav="admin" class="nav-admin-link">
          <svg class="nav-admin-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          관리자
        </a>
      </nav>
    </div>
  </header>
  <main class="auth-page">
    <div class="auth-card">
      <h1 class="logo-large">LabBot</h1>
      <p class="auth-subtitle">연구실 물품 대여관리 시스템</p>

      <p class="auth-error" id="loginError" style="display: none;"></p>

      <form id="loginForm">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required / aria-label="you@example.com">

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required / aria-label="••••••••">

        <div class="auth-actions">
          <button type="submit" id="loginBtn" class="btn btn-primary">로그인</button>
          <a href="signup.html" id="signupLink" class="btn btn-secondary">회원가입</a>
        </div>
      </form>
    </div>
  </main>

  <button type="button" class="fab fab-inquiry" id="inquiryFabBtn" aria-label="문의하기">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
      <path d="M4 7.5L12 13l8-5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
  <button type="button" class="fab" id="chatFabBtn" aria-label="챗봇 열기">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M20.5 11.7c0 4.25-3.8 7.7-8.5 7.7-1.2 0-2.35-.23-3.4-.64L4 20.5l1.45-3.85C4.2 15.3 3.5 13.58 3.5 11.7 3.5 7.45 7.3 4 12 4s8.5 3.45 8.5 7.7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
      <circle cx="8.5" cy="11.7" r="1" fill="currentColor" />
      <circle cx="12" cy="11.7" r="1" fill="currentColor" />
      <circle cx="15.5" cy="11.7" r="1" fill="currentColor" />
    </svg>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/inquiry-data.js"></script>
  <script src="js/restock-data.js"></script>
  <script src="js/inquiry-widget.js"></script>
  <script src="js/items-data.js"></script>
  <script src="js/rentals.js"></script>
  <script src="js/chat-data.js"></script>
  <script src="js/chat-widget.js"></script>
  <script src="js/rental-progress-widget.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
